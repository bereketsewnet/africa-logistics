server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text-based responses on the wire (JS/CSS/HTML/SVG/JSON).
    # Images are already .webp (pre-compressed) so they're left out.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/xml
        image/svg+xml;

    # React Router — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets. Serving these from their own location (instead of
    # falling through to the SPA's `location /`) means a missing file returns
    # a clean 404 — important for optional images (e.g. team photos) that use
    # an <img onError> fallback: without this, a missing .webp would silently
    # get index.html back with a 200, and the browser could render/cache that
    # confusingly instead of triggering the fallback.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Stream the Android installer only when requested. It is deliberately not
    # compressed or preloaded, so the APK has no effect on page speed.
    location = /downloads/afri-logistics-android.apk {
        try_files $uri =404;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="Afri-Logistics-Android.apk"';
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # Disable caching for index.html so new deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
