<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080b14" />

  <!-- ── Primary SEO ── -->
  <title>Afri Logistics — Delivering Excellence in Every Mile</title>
  <meta name="description"
    content="Afri Logistics is Ethiopia's premier logistics company specializing in local and cross-country delivery services, with driver &amp; vehicle matching, real-time tracking, and complete logistics management." />
  <meta name="keywords"
    content="Afri Logistics, Africa Logistics, Ethiopia logistics, cross-country delivery Ethiopia, freight forwarding Ethiopia, local delivery Adama, driver vehicle matching, cargo tracking Ethiopia" />
  <meta name="author" content="Afri Logistics" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <link rel="canonical" href="https://afri-logistics.com/" />

  <!-- ── Performance ── -->
  <link rel="preconnect" href="https://backend.afri-logistics.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;display=swap"
    onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;display=swap" /></noscript>
  <script>
    // The SPA uses one index for every route. Preload the hero only on the
    // public homepage so login/dashboard users do not pay for it.
    if (window.location.pathname === '/') {
      const heroPreload = document.createElement('link')
      heroPreload.rel = 'preload'
      heroPreload.as = 'image'
      heroPreload.href = '/bg.webp'
      heroPreload.fetchPriority = 'high'
      document.head.appendChild(heroPreload)
    }
  </script>

  <!-- Visible immediately, before the JavaScript bundle has downloaded. -->
  <style>
    .startup-loader {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 14px;
      background: linear-gradient(145deg, #f8fbf5 0%, #edf5e5 100%);
      color: #31520f;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .startup-loader__mark {
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      border-radius: 17px;
      color: #fff;
      background: linear-gradient(135deg, #71ad25, #3e6113);
      box-shadow: 0 14px 34px rgba(62, 97, 19, .24);
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -.5px;
    }
    .startup-loader__spinner {
      width: 26px;
      height: 26px;
      border: 3px solid rgba(97, 148, 31, .2);
      border-top-color: #61941f;
      border-radius: 50%;
      animation: startup-spin .7s linear infinite;
    }
    .startup-loader__label { font-size: 14px; font-weight: 650; }
    @keyframes startup-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .startup-loader__spinner { animation-duration: 1.5s; }
    }
  </style>

  <!-- ── Open Graph / Facebook ── -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Afri Logistics" />
  <meta property="og:url" content="https://afri-logistics.com/" />
  <meta property="og:title" content="Afri Logistics — Delivering Excellence in Every Mile" />
  <meta property="og:description"
    content="Ethiopia's premier logistics company specializing in local and cross-country delivery services." />
  <meta property="og:image" content="https://afri-logistics.com/bg.webp" />
  <meta property="og:image:width" content="1746" />
  <meta property="og:image:height" content="901" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:locale:alternate" content="am_ET" />

  <!-- ── Twitter Card ── -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Afri Logistics — Delivering Excellence in Every Mile" />
  <meta name="twitter:description"
    content="Ethiopia's premier logistics company specializing in local and cross-country delivery services." />
  <meta name="twitter:image" content="https://afri-logistics.com/bg.webp" />

  <!-- ── Structured data (JSON-LD) ──
       Mirrors copy already on the page (tagline, overview, contact fallbacks,
       service list) — no new claims are introduced here. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "@id": "https://afri-logistics.com/#organization",
    "name": "Afri Logistics",
    "alternateName": "Africa Logistics",
    "url": "https://afri-logistics.com/",
    "logo": "https://afri-logistics.com/favicon.png",
    "image": "https://afri-logistics.com/bg.webp",
    "description": "Afri Logistics is Ethiopia's premier logistics company specializing in local and cross-country delivery services. We match drivers and vehicles for efficient and reliable transportation, ensuring seamless delivery and complete logistics management tailored to your business needs.",
    "slogan": "Delivering Excellence in Every Mile.",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Adama Gadaa Street",
      "addressLocality": "Adama",
      "addressCountry": "ET"
    },
    "contactPoint": [
      {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "telephone": "+251-91-155-5575",
        "email": "info@africalogistics.com.et",
        "areaServed": "ET"
      }
    ],
    "makesOffer": [
      { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Cross-Country Delivery" } },
      { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Local Delivery Services" } },
      { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Driver and Vehicle Matching" } },
      { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "End-to-End Delivery Management" } },
      { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Tailored Logistics Solutions" } }
    ]
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "url": "https://afri-logistics.com/",
    "name": "Afri Logistics",
    "publisher": { "@id": "https://afri-logistics.com/#organization" }
  }
  </script>
</head>

<body>
  <div id="root">
    <main class="startup-loader" role="status" aria-live="polite">
      <span class="startup-loader__mark" aria-hidden="true">AL</span>
      <span class="startup-loader__spinner" aria-hidden="true"></span>
      <span class="startup-loader__label">Loading Afri Logistics…</span>
    </main>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
